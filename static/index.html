<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞机对战游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== 顶部标题栏 ==================== -->
    <div id="header">
        <h1>飞机对战游戏</h1>
        <div id="mode-selector">
            <button id="btn-mode-local" class="btn-mode active">本地双人对战</button>
            <button id="btn-mode-online" class="btn-mode">联机对战</button>
        </div>
    </div>

    <!-- ==================== 联机房间面板 ==================== -->
    <div id="room-panel" style="display: none;">
        <div class="room-controls">
            <button id="btn-create-room" class="btn-primary">创建房间</button>
            <span class="room-divider">或</span>
            <input id="input-room-id" type="text" placeholder="输入房间号" maxlength="6" autocomplete="off">
            <button id="btn-join-room" class="btn-primary">加入房间</button>
        </div>
        <div id="room-info">
            <span id="room-status">未连接</span>
            <span id="room-id-display"></span>
        </div>
    </div>

    <!-- ==================== 信息栏 ==================== -->
    <div id="info-bar">
        <div id="turn-indicator">当前回合：玩家1</div>
        <div id="message-box">点击你的"攻击敌方"棋盘开始</div>
        <button id="btn-restart" class="btn-secondary">重新开始</button>
    </div>

    <!-- ==================== 主游戏区：四棋盘 ==================== -->
    <div id="game-area">
        <!-- 玩家1 区域 -->
        <div class="player-zone" id="zone-p0">
            <h2 class="zone-title active-player">玩家1</h2>
            <div class="zone-boards">
                <div class="board-wrap" id="wrap-my-0">
                    <h3>我方部署</h3>
                    <div class="board-cover-wrapper">
                        <div class="board my-board" id="board-my-0"></div>
                        <div class="board-cover" id="cover-0">🙈<br>对方回合<br>不可查看</div>
                    </div>
                </div>
                <div class="board-wrap">
                    <h3>攻击敌方</h3>
                    <div class="board enemy-board" id="board-enemy-0"></div>
                    <p class="hint">剩余敌机：<b id="score-0">3</b></p>
                </div>
            </div>
        </div>

        <!-- 分隔 -->
        <div class="zone-divider"></div>

        <!-- 玩家2 区域 -->
        <div class="player-zone" id="zone-p1">
            <h2 class="zone-title">玩家2</h2>
            <div class="zone-boards">
                <div class="board-wrap" id="wrap-my-1">
                    <h3>我方部署</h3>
                    <div class="board-cover-wrapper">
                        <div class="board my-board" id="board-my-1"></div>
                        <div class="board-cover" id="cover-1">🙈<br>对方回合<br>不可查看</div>
                    </div>
                </div>
                <div class="board-wrap">
                    <h3>攻击敌方</h3>
                    <div class="board enemy-board" id="board-enemy-1"></div>
                    <p class="hint">剩余敌机：<b id="score-1">3</b></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 游戏结束弹窗 ==================== -->
    <div id="game-over-modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h2 id="winner-text"></h2>
            <button id="btn-new-game" class="btn-primary">再来一局</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
